; ============================================================================
; JARVIS satellite firmware — GUITION JC8012P4A1C_I_W_Y (ESP32-P4 + ESP32-C6)
; Custom JARVIS voice satellite: ES8311 audio, JD9365 MIPI-DSI display,
; GSL3680 touch, WS2812 reactor LED. Brain lives on the assistant host over WS.
;
;   Build :  pio run -e jarvis-panel
;   Flash :  pio run -e jarvis-panel -t upload
;   Monitor: pio device monitor -e jarvis-panel
;
; Platform: pioarduino/platform-espressif32 (ships ESP-IDF v5.5.x + P4 RISC-V
; toolchain). An ESP32-P4 target needs this fork — the upstream
; platformio/espressif32 has no P4 board/toolchain support.
; ============================================================================

[platformio]
boards_dir = boards

[env:jarvis-panel]
platform = https://github.com/pioarduino/platform-espressif32.git#develop
framework = espidf
board = gc_jc8012p4a1c
monitor_speed = 115200
upload_speed = 1500000
board_build.flash_mode = qio
; Use our 16 MB layout (nvs/otadata/phy_init/ota_0/ota_1/assets). Without this
; the builder silently falls back to the default single-app table at 0x10000.
board_build.partitions = partitions.csv

build_flags =
    -D JARVIS_LOG_TAG=\"jarvis\"
; (fix_esp_hosted.py — applied pre-build — patches the builder for the
; esp_hosted component's forced-include option; no local -include needed)

; Pre-build hook: patches the esp_hosted component's "-include" option for
; PlatformIO's option flattening (see scripts/fix_esp_hosted.py). Runs with a
; friendly no-op before the component manager has ever fetched esp_hosted.
extra_scripts = pre:scripts/fix_esp_hosted.py
; JARVIS_FW_VERSION (src/jarvis_config.h) is only the FALLBACK version string
; for builds that have no app descriptor version; dev builds report the real
; git-describe version and release builds get the release number stamped by
; tools/release.sh (via version.txt -> PROJECT_VER -> app descriptor).

; Reduce build noise; keep warnings visible for our code.
build_unflags =
    -Werror

; ============================================================================
; Optional: ESP-SR audio front-end — AEC + VAD + hands-free voice barge-in.
;
; Same application, but with the ESP-SR AFE compiled in
; (CONFIG_JARVIS_ENABLE_ESP_SR=y). It differs from jarvis-panel in three ways:
;
;   * sdkconfig.sr.defaults is layered on top of sdkconfig.defaults, enabling
;     the AFE and selecting the nsnet2 + vadnet1 neural models;
;   * partitions.sr.csv carves a 2 MB `model` partition out of the unused
;     `assets` reserve — everything below 0x7C0000 is byte-identical, so the
;     app slots, NVS and OTA state are untouched;
;   * scripts/esp_sr_model.py packs those models with esp-sr's movemodel.py
;     and flashes the result to the `model` partition, because PlatformIO
;     does not run the CMake target that normally does that.
;
; The first build downloads esp-sr + esp-dl (~300 MB). The default
; `jarvis-panel` build never sees either, because the esp-sr dependency in
; src/idf_component.yml is gated on the JARVIS_ENABLE_ESP_SR Kconfig symbol.
;
;   Build : pio run -e jarvis-panel-sr
;   Flash : pio run -e jarvis-panel-sr -t upload
;
; NOTE: ESP-IDF only applies sdkconfig defaults to symbols it has not seen
; before. If you edit sdkconfig.sr.defaults after a build, delete the
; generated sdkconfig.jarvis-panel-sr (or run `pio run -e jarvis-panel-sr -t
; fullclean`) so the new values are picked up.
; ============================================================================
[env:jarvis-panel-sr]
extends = env:jarvis-panel
board_build.partitions = partitions.sr.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.sr.defaults"
extra_scripts =
    pre:scripts/fix_esp_hosted.py
    scripts/esp_sr_model.py
