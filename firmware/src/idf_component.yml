## JARVIS satellite — component dependencies (ESP component registry)
## These are fetched automatically by the IDF component manager during build.
dependencies:
  idf: ">=5.4"
  # MIPI-DSI JD9365 panel driver (same 10.1" 800x1280 panel family as the
  # ESP32-P4 Function EV Board). Provides esp_lcd_new_panel_jd9365().
  espressif/esp_lcd_jd9365: "^2.0.2"
  # ES8311 mono audio codec (I2S + I2C).
  espressif/es8311: "^1.0.0"
  # Generic codec device layer (esp_codec_dev_read/write, volume, gain).
  espressif/esp_codec_dev: "~1.6.0"
  # WebSocket client for the JARVIS bridge protocol.
  espressif/esp_websocket_client: "^1.8.0"
  # --- Wi-Fi via the on-board ESP32-C6 (ESP-Hosted over SDIO) ---------------
  # P4 has no radio. Uncomment the two lines below AND enable the matching
  # CONFIG_ESP_HOSTED_* / CONFIG_ESP_WIFI_REMOTE_ENABLED block in
  # sdkconfig.defaults once the C6 slave firmware is flashed (docs/BRINGUP.md).
  # espressif/esp_hosted: "^3.0.9"
