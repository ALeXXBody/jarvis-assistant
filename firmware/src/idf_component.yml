## JARVIS satellite — component dependencies (ESP component registry)
## These are fetched automatically by the IDF component manager during build.
dependencies:
  idf: ">=5.4"
  # MIPI-DSI JD9365 panel driver: VENDORED, not the registry component.
  # The registry release (v2.0.2+) drives this panel with DPI timings (80 MHz,
  # wider vsync porches) and an init table that make it boot black: every call
  # "succeeds" but the module never lights. The driver copied into
  # components/vendor_lcd_jd9365 (from the working community BSP for this
  # exact board) uses 60 MHz / narrower porches + the matching vendor init
  # sequence and brings it up correctly. See that folder's CMakeLists.txt.
  # ES8311 mono audio codec (I2S + I2C).
  espressif/es8311: "^1.0.0"
  # Generic codec device layer (esp_codec_dev_read/write, volume, gain).
  espressif/esp_codec_dev: "~1.6.0"
  # WebSocket client for the JARVIS bridge protocol.
  espressif/esp_websocket_client: "^1.8.0"
  # --- Wi-Fi via the on-board ESP32-C6 (ESP-Hosted over SDIO) ---------------
  # The C6 connects to the P4 over SDIO and runs the vendor slave firmware
  # (JC-C6-slave, shipped on the board), which reports coprocessor fw 2.3.2 -
  # the 2.x ESP-Hosted line. The host is pinned to the 2.x line (2.13.0, the
  # newest 2.x; esp_wifi_remote 1.6 requires >= 2.11) so the host and
  # coprocessor MAJOR versions match and ESP-Hosted does not log its "major
  # version mismatch - OTA coprocessor from host" advisory. Requires the
  # matching CONFIG_ESP_HOSTED_* block in sdkconfig.defaults.
  espressif/esp_hosted: "2.13.0"
  # Routes the standard esp_wifi_* API to the on-board C6 over ESP-Hosted.
  # Without it CONFIG_ESP_WIFI_REMOTE_ENABLED does not exist and Wi-Fi is
  # compiled out ("radio unavailable" on the setup sheet).
  espressif/esp_wifi_remote: "^1.5.3"
  # --- Optional: ESP-SR audio front-end (AEC + NS + VAD) -------------------
  # Conditional on the project Kconfig symbol JARVIS_ENABLE_ESP_SR (defined in
  # src/Kconfig.projbuild), so the default `jarvis-panel` build does NOT
  # download esp-sr or its ~180 MB esp-dl dependency. Build the
  # `jarvis-panel-sr` env to pull this in (see platformio.ini).
  #
  # The `$CONFIG{...}` Kconfig conditional requires ESP-IDF >= 5.5 and a
  # symbol that is defined in the project (not in a transitive dependency).
  espressif/esp-sr:
    version: "2.6.0"
    matches:
      - if: "$CONFIG{JARVIS_ENABLE_ESP_SR} == True"
