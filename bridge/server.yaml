# JARVIS voice pipeline config — secrets live in ~/.hermes/.env (not here).

llm:
  provider: hermes            # primary brain: Hermes Agent API (local Ollama behind it)
  model: gpt-oss:20b          # used only by the fallback provider
  api_key_env: ANTHROPIC_API_KEY
  max_tokens: 220
  temperature: 0.3
  history_turns: 12           # fallback provider only

hermes:
  base_url: http://127.0.0.1:8642   # Hermes Agent API server (loopback)
  api_key_env: API_SERVER_KEY       # read from ~/.hermes/.env
  conversation: jarvis-main          # shared voice thread name
  session_key: jarvis:user:main      # stable long-term memory scope
  timeout: 240
  # Spoken filler: if the reply has not started within this many seconds of the
  # END OF YOUR SPEECH (STT time is already discounted), speak the next ack_text.
  # 0 disables. The cue is cancelled the moment real reply audio starts, and is
  # skipped when the agent answers quickly — but on a 10s+ turn any useful value
  # will speak on most turns, which is the silence it exists to cover.
  ack_after_seconds: 2.0
  ack_texts: ["On it.", "Still working.", "Almost there."]
  # Startup warm-up of the local LLM server so the first voice turn after a
  # service start never pays the model load (only meaningful when the brain
  # hosts the model); override the model if your llmproxy serves something else.
  llm_warm_url: "http://127.0.0.1:11440/v1/chat/completions"
  llm_warm_model: "gpt-oss:20b"
  fallback_provider: anthropic
  instructions: >
    You are speaking aloud through a voice pipeline. Replies are converted
    to speech, so use plain conversational prose only: no markdown, no lists,
    no code blocks. Default to one to three short sentences unless asked for
    more detail. Speak numbers, dates, times and phone numbers as natural
    spoken words. Never speak secrets, API keys, or passwords aloud.
    Tool discipline: you are on a live voice channel. The person is waiting
    in real time, and every tool round-trip is silence on the panel. Use
    tools ONLY when the request genuinely needs house or system state, or
    performs an action (devices, files, schedules). For greetings, small
    talk, arithmetic you can do mentally, and general-knowledge questions,
    answer directly from the conversation and do not run any tool.

stt:
  model: small.en           # LOCAL faster-whisper model (downloads on first use)
  device: cpu
  compute_type: int8
  sample_rate: 16000
  partials: true            # live transcript while speaking
  partial_interval: 1.2     # seconds of new audio between partial passes
  # faster-whisper strips the trailing silence the panel's gate appends to
  # every turn before decoding - cheaper and faster finalize.
  vad_filter: true
  vad_min_silence_ms: 500
  # When the mic heard nothing, the assistant says one of these (a real
  # speaking turn, not an error) and the panel returns to Ready.
  empty_responses: ["I didn't catch that.", "Come again?", "Pardon?"]
  # Optional GPU worker (worker/stt_server.py on any NVIDIA machine):
  # remote:
  #   name: gpu
  #   url: http://192.0.2.50:8768/stt
  #   token_env: JARVIS_HUD_TOKEN
  #   timeout: 6

machines: []                # no remote worker panels for now

usage:
  llm_cost_per_mtok_input: 0
  llm_cost_per_mtok_output: 0

server:
  host: 0.0.0.0
  port: 8765                # plain ws:// for the satellite + PTT client
  tls_ports: []             # browser HUD would need certs; satellite does not
  tls_cert: certs/cert.pem
  tls_key: certs/key.pem
  dashboard_proxy:
    port: 0                 # disabled (needs certs)
    target: http://127.0.0.1:9119

security:
  hud_token_env: JARVIS_HUD_TOKEN   # set in ~/.hermes/.env; unset = auth disabled
  extra_origin_hosts: []            # e.g. ["192.0.2.60"] if you open the HUD by raw IP

voice:
  provider: piper                # fully local TTS — no cloud, no key
  model: /opt/jarvis/voices/en_GB-alan-medium.onnx
  voice_id: en_GB-alan-medium
  output_format: pcm_16000
  # Stream the reply clause by clause: a chunk always ends at .!? and may also
  # end at ,;: once it is at least this many characters. Lower = the first
  # words start playing sooner; 0 = only split on full stops. Every chunk pays
  # Piper's startup, so 40-80 is the sweet spot — going far below that makes the
  # reply choppy and no faster overall.
  min_chunk_chars: 60
  # The FIRST chunk uses a smaller floor so the reply's opening words play
  # immediately; the rest of the reply still respects min_chunk_chars.
  first_chunk_chars: 24

persona:                     # used only by the anthropic fallback path
  system_prompt: >
    You are the spoken interface for the household's personal agent — a dry,
    calm, precise British butler called JARVIS. Default to one to three short
    sentences. Never speak secrets aloud.