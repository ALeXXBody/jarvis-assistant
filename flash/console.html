<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S. panel — serial console</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
         background: #0b0f1a; color: #c9d4f2; }
  header { display: flex; align-items: center; gap: .6rem; padding: .55rem .9rem;
           background: #101a33; border-bottom: 1px solid #23335e; flex-wrap: wrap; }
  header b { color: #7fd4ff; margin-right: .4rem; font-family: system-ui, sans-serif; }
  button, input[type=text] {
      background: #141f3d; color: #dbe4ff; border: 1px solid #2b3c6e;
      border-radius: 6px; padding: .35rem .7rem; font: inherit; }
  button:hover { background: #1b2a52; cursor: pointer; }
  #connect { background: #0b7285; border-color: #0b7285; color: #eaf7ff; font-weight: 600; }
  #connect.off { background: #5c4b1e; border-color: #5c4b1e; color: #ffe9a8; }
  #filter { min-width: 14rem; flex: 1; }
  #status { color: #7a89b8; }
  main { flex: 1; overflow-y: auto; padding: .5rem .9rem; white-space: pre-wrap; word-break: break-all; }
  .er  { color: #ff7a90; }
  .wr  { color: #ffd479; }
  .in  { color: #c9d4f2; }
  .db  { color: #6f7fa8; }
  .tx  { color: #b7a6ff; }
  footer { display: flex; gap: .4rem; padding: .55rem .9rem;
           background: #101a33; border-top: 1px solid #23335e; flex-wrap: wrap; align-items: center; }
  #send { flex: 1; min-width: 12rem; }
  .hint { color: #7a89b8; font-family: system-ui, sans-serif; font-size: .85rem; flex-basis: 100%; }
</style>
</head>
<body>
<header>
  <b>J.A.R.V.I.S. panel console</b>
  <button id="connect">Connect</button>
  <button id="clear">Clear</button>
  <button id="save">Save log</button>
  <button id="copy">Copy</button>
  <input id="filter" type="text" placeholder="filter lines (substring)">
  <label><input type="checkbox" id="pause"> pause</label>
  <span id="status">not connected</span>
</header>

<main id="log"></main>

<footer>
  <input id="send" type="text" placeholder="type text and press Enter to send to the panel…">
  <button class="k" data-c="l" title="start listening">listen</button>
  <button class="k" data-c="s" title="stop listening / run turn">stop</button>
  <button class="k" data-c="x" title="abort turn">abort</button>
  <button class="k" data-c="a" title="approve tool">allow</button>
  <button class="k" data-c="d" title="deny tool">deny</button>
  <button class="k" data-c="r" title="restart ws client">reconnect</button>
  <button class="k" data-c="u" title="check for update">update</button>
  <button class="k" data-c="+" title="volume up">vol+</button>
  <button class="k" data-c="-" title="volume down">vol−</button>
  <button id="sendBtn">Send</button>
  <span class="hint">keys mirror the firmware's serial console (jarvis_wake.c) ·
    works over the same USB cable as the flasher, no Wi-Fi needed ·
    Chrome / Edge / Opera only</span>
</footer>

<script>
"use strict";
const el = {
  log: document.getElementById("log"),
  connect: document.getElementById("connect"),
  clear: document.getElementById("clear"),
  save: document.getElementById("save"),
  copy: document.getElementById("copy"),
  filter: document.getElementById("filter"),
  pause: document.getElementById("pause"),
  status: document.getElementById("status"),
  send: document.getElementById("send"),
  sendBtn: document.getElementById("sendBtn"),
};

let port = null, writer = null, running = false;
let partial = "";          /* bytes split across reads, joined at '\n' */
let stick = true;          /* auto-scroll unless the user scrolled up */
const MAXLINES = 20000;
let lines = [];            /* kept for save/copy (fully rendered history) */

/* ---- port ---- */
el.connect.addEventListener("click", async () => {
  if (running) { await disconnect(); return; }
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });   /* baud is ignored by USB-Serial-JTAG */
    writer = port.writable.getWriter();
    await writer.write(new TextEncoder().encode("\r"));
    readLoop();
    setStatus("connected — panel logs follow");
  } catch (e) {
    setStatus(e.name === "NotFoundError" ? "no device selected"
                                         : "error: " + (e.message || e));
  }
});

async function readLoop() {
  running = true;
  el.connect.textContent = "Disconnect";
  const dec = new TextDecoder("utf-8");
  try {
    while (running) {
      const reader = port.readable.getReader();
      try {
        while (running) {
          const { value, done } = await reader.read();
          if (value) feedText(dec.decode(value, { stream: true }));
          if (done) throw new Error("stream closed");
        }
      } catch (e) {
        try { reader.releaseLock(); } catch (_) {}
        if (e.message === "stream closed") throw e;
      }
      await new Promise(r => setTimeout(r, 200));   /* reader hiccup; retry */
    }
  } catch (e) {
    setStatus("port closed — click Connect to reattach");
  }
}

async function disconnect() {
  running = false;
  try { writer?.releaseLock(); } catch (_) {}
  try { const r = port?.readable?.getReader(); r?.cancel(); r?.releaseLock?.(); } catch (_) {}
  try { await port?.close(); } catch (_) {}
  port = writer = null;
  el.connect.textContent = "Connect";
  setStatus("not connected");
}

function setStatus(msg) { el.status.textContent = msg; if (port) el.connect.textContent = "Disconnect"; }

/* ---- render ---- */
const ANSI = /\x1b\[[0-9;]*m/g;

function feedText(chunk) {
  if (el.pause.checked) { partial = chunk; return; }   /* show only the live part when resumed */
  partial += chunk;
  /* flush complete lines; keep the tail as a partial */
  let idx;
  while ((idx = partial.indexOf("\n")) >= 0) {
    const line = partial.slice(0, idx);
    partial = partial.slice(idx + 1);
    appendLine(line);
  }
  if (partial.length > 4096) { appendLine(partial); partial = ""; }
}

function levelOf(line) {
  if (/\bE ?\(\d+\)/.test(line)) return "er";
  if (/\bW ?\(\d+\)/.test(line)) return "wr";
  if (/\bD ?\(\d+\)/.test(line)) return "db";
  if (/^>>>/.test(line))         return "tx";
  return "in";
}

function makeDiv(line) {
  const div = document.createElement("div");
  div.className = levelOf(line);
  div.textContent = line;
  return div;
}

function appendLine(raw) {
  const line = raw.replace(ANSI, "").replace(/\r$/, "");
  if (!line) return;
  lines.push(line);
  if (lines.length > MAXLINES) lines.splice(0, lines.length - MAXLINES);

  const f = el.filter.value;
  if (f && !line.includes(f)) return;
  if (el.log.childElementCount > MAXLINES) el.log.removeChild(el.log.firstChild);

  el.log.appendChild(makeDiv(line));
  if (stick) el.log.scrollTop = el.log.scrollHeight;
}

el.log.addEventListener("scroll", () => {
  stick = el.log.scrollHeight - el.log.scrollTop - el.log.clientHeight < 40;
});

/* ---- toolbar ---- */
el.clear.addEventListener("click", () => { el.log.replaceChildren(); lines = []; });
el.pause.addEventListener("change", () => {
    setStatus(el.pause.checked ? "paused (device still logging)"
                               : (port ? "connected" : "not connected")); });
el.save.addEventListener("click", () => {
  const blob = new Blob([lines.join("\n") + "\n"], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "jarvis-panel-log.txt";
  a.click();
  URL.revokeObjectURL(a.href);
});
el.copy.addEventListener("click", async () => {
  await navigator.clipboard.writeText(lines.join("\n"));
  setStatus("copied " + lines.length + " lines to the clipboard");
});

/* ---- send ---- */
async function send(s) {
  if (!writer) { setStatus("not connected"); return; }
  await writer.write(new TextEncoder().encode(s));
}
el.sendBtn.addEventListener("click", () => { const v = el.send.value; el.send.value = ""; if (v) send(v); });
el.send.addEventListener("keydown", e => {
  if (e.key === "Enter") { const v = el.send.value; el.send.value = ""; if (v) send(v); }
});
document.querySelectorAll("button.k").forEach(b =>
  b.addEventListener("click", () => { el.send.value = ""; send(b.dataset.c); }));
</script>
</body>
</html>
